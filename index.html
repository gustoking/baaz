<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Baaz Cuts — Coming Soon to Manchester</title>
<meta name="description" content="Baaz Cuts is coming soon to Manchester. Precision cuts, sharp finishes, premium surroundings.">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090909;color:#f4efe6}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;background:radial-gradient(circle at 50% 18%,rgba(200,155,85,.12),transparent 28rem),#090909}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:linear-gradient(30deg,#c89b55 12%,transparent 12.5%,transparent 87%,#c89b55 87.5%),linear-gradient(150deg,#c89b55 12%,transparent 12.5%,transparent 87%,#c89b55 87.5%);background-size:82px 144px;mask-image:linear-gradient(#000,transparent 75%)}
.wrap{position:relative;z-index:1;min-height:100vh;max-width:1200px;margin:auto;padding:24px 28px 20px;display:grid;grid-template-rows:auto 1fr auto}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:18px;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem}
header{color:#aaa197}.brand{color:#efd29a}
main{display:grid;place-items:center;text-align:center;padding:10px 0 28px}.hero{width:min(900px,100%)}
.logo{width:min(380px,78vw);margin:auto;filter:drop-shadow(0 22px 42px rgba(0,0,0,.52))}
.logo img{display:block;width:100%;height:auto;image-rendering:auto}
.eyebrow{color:#efd29a;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;margin-top:8px}
h1{margin:18px auto 12px;font:500 clamp(2.7rem,6vw,5.7rem)/.96 Georgia,"Times New Roman",serif;letter-spacing:-.045em;background:linear-gradient(180deg,#f7e2b9,#c28e42 60%,#8c612d);-webkit-background-clip:text;background-clip:text;color:transparent}
p{max-width:650px;margin:auto;color:#c8c0b5;font-size:clamp(1rem,2vw,1.15rem);line-height:1.7}
.pills{margin:28px auto 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{padding:11px 15px;border:1px solid rgba(200,155,85,.28);border-radius:999px;background:rgba(255,255,255,.025);color:#d5cec4;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase}
footer{border-top:1px solid rgba(255,255,255,.07);padding-top:18px;color:#706a63}
@media(max-width:620px){.wrap{padding:18px}header{align-items:flex-start}header div:last-child{text-align:right;max-width:140px;line-height:1.45}.logo{width:min(300px,82vw)}footer{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">Baaz Cuts</div><div>Manchester · Opening Soon</div></header>
<main><section class="hero">
<div class="logo"><img src="./baaz-logo.webp?v=4" alt="Baaz Cuts Manchester logo" width="1000" height="1000" decoding="async"></div>
<div class="eyebrow">A new standard is landing</div>
<h1>Manchester, get ready.</h1>
<p>Precision cuts. Sharp finishes. Premium surroundings. Baaz Cuts is bringing a bold new barber experience to Manchester.</p>
<div class="pills"><span class="pill">Modern barbering</span><span class="pill">Premium finish</span><span class="pill">Manchester</span></div>
</section></main>
<footer><span>Baaz Cuts © 2026</span><span>Opening details announced soon</span></footer>
</div>
</body>
</html>
