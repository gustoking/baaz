<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Baaz Cuts — Coming Soon to Manchester</title>
<meta name="description" content="Baaz Cuts is coming soon to Manchester. Precision cuts, sharp finishes, premium surroundings.">
<style>
:root {
  --bg:#090909; --gold:#c89b55; --gold2:#efd29a; --wood:#6f4529;
  --text:#f4efe6; --muted:#aaa197; --line:rgba(200,155,85,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 50% 22%,rgba(200,155,85,.11),transparent 28rem),
    linear-gradient(120deg,transparent 0 43%,rgba(111,69,41,.08) 43% 44%,transparent 44% 100%);
}
.hex-grid{
  position:fixed;inset:0;opacity:.11;pointer-events:none;
  background-image:
    linear-gradient(30deg,#c89b55 12%,transparent 12.5%,transparent 87%,#c89b55 87.5%,#c89b55),
    linear-gradient(150deg,#c89b55 12%,transparent 12.5%,transparent 87%,#c89b55 87.5%,#c89b55),
    linear-gradient(30deg,#c89b55 12%,transparent 12.5%,transparent 87%,#c89b55 87.5%,#c89b55),
    linear-gradient(150deg,#c89b55 12%,transparent 12.5%,transparent 87%,#c89b55 87.5%,#c89b55),
    linear-gradient(60deg,rgba(200,155,85,.42) 25%,transparent 25.5%,transparent 75%,rgba(200,155,85,.42) 75%);
  background-size:82px 144px;
  background-position:0 0,0 0,41px 72px,41px 72px,0 0;
  mask-image:linear-gradient(to bottom,#000,transparent 76%);
}
.wood-lines{
  position:fixed;right:0;top:0;width:12px;height:100%;opacity:.5;
  background:repeating-linear-gradient(to right,#25170f 0 2px,#6f4529 2px 5px,#2d1b12 5px 7px)
}
.wrap{
  position:relative;z-index:1;min-height:100vh;max-width:1240px;margin:auto;
  padding:26px 30px 22px;display:grid;grid-template-rows:auto 1fr auto
}
header{display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;color:var(--gold2)}
.mark{width:28px;aspect-ratio:1;border:1px solid var(--gold);clip-path:polygon(25% 6.7%,75% 6.7%,100% 50%,75% 93.3%,25% 93.3%,0 50%);background:linear-gradient(135deg,rgba(200,155,85,.18),transparent)}
.location{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
main{display:grid;place-items:center;padding:28px 0 38px}
.hero{width:min(860px,100%);text-align:center}
.logo{width:min(540px,88vw);margin:0 auto 4px;filter:drop-shadow(0 24px 50px rgba(0,0,0,.55))}
.logo img{display:block;width:100%;height:auto}
.eyebrow{display:inline-flex;align-items:center;gap:12px;color:var(--gold2);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase}
.eyebrow:before,.eyebrow:after{content:"";width:42px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow:after{transform:rotate(180deg)}
h1{margin:22px auto 14px;max-width:780px;font:500 clamp(2.6rem,6vw,5.8rem)/.96 Georgia,"Times New Roman",serif;letter-spacing:-.045em}
h1 span{background:linear-gradient(180deg,#f7e2b9 0%,#c28e42 58%,#8c612d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:650px;margin:auto;color:#c8c0b5;font-size:clamp(1rem,2vw,1.17rem);line-height:1.75}
.pills{margin:32px auto 0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pill{padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:#d5cec4;font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;backdrop-filter:blur(8px)}
footer{border-top:1px solid rgba(255,255,255,.07);padding-top:18px;display:flex;justify-content:space-between;gap:20px;color:#777068;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:640px){
  .wrap{padding:20px 18px 18px} .location{text-align:right;max-width:130px;line-height:1.5}
  .logo{width:min(450px,96vw)} main{padding-top:12px} .sub{font-size:.98rem;line-height:1.62}
  footer{flex-direction:column;gap:8px}
}
</style>
</head>
<body>
<div class="hex-grid"></div>
<div class="wood-lines"></div>
<div class="wrap">
<header>
  <div class="brand"><span class="mark"></span><span>Baaz Cuts</span></div>
  <div class="location">Manchester · Opening Soon</div>
</header>
<main>
  <section class="hero">
    <div class="logo"><img src="baaz-cuts-logo.png" alt="Baaz Cuts logo"></div>
    <div class="eyebrow">A new standard is landing</div>
    <h1><span>Manchester, get ready.</span></h1>
    <p class="sub">Precision cuts. Sharp finishes. Premium surroundings. Baaz Cuts is bringing a bold new barber experience to Manchester.</p>
    <div class="pills">
      <div class="pill">Modern barbering</div>
      <div class="pill">Premium finish</div>
      <div class="pill">Manchester</div>
    </div>
  </section>
</main>
<footer>
  <span>Baaz Cuts © 2026</span>
  <span>Opening details announced soon</span>
</footer>
</div>
</body>
</html>
